<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Requests · Fenwick and Vale</title>
<meta name="theme-color" content="#F5F1E8">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/assets/fonts/schibsted-grotesk-latin-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/ibm-plex-mono-latin-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/site.css">
<script src="/assets/clock.js" defer></script>
<script defer src="/_vercel/insights/script.js"></script>
<style>
  .admin { padding: 40px 0 64px; }
  .admin h1 { font-size: clamp(32px, 4vw, 46px); margin-bottom: 8px; }
  .admin .meta { color: var(--soft); margin: 0 0 28px; }
  .admin .tools { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; margin: 0 0 24px; }
  .admin .tools .btn { min-height: 44px; }
  .admin .btn.quiet { background: none; color: var(--ink); }
  .admin .btn.quiet:hover { background: var(--ink); color: var(--page); border-color: var(--ink); }
  .admin .count { color: var(--soft); font-family: var(--mono); font-size: 15px; }
  .req { width: 100%; }
  .req th, .req td { text-align: left; padding: 12px 12px 12px 0; border-bottom: 1px solid var(--rule); vertical-align: top; font-size: 16px; line-height: 1.45; }
  .req th { font-family: var(--mono); font-weight: 400; font-size: 15px; color: var(--soft); border-top: 1px solid var(--rule); white-space: nowrap; }
  .req td.when, .req td.page { font-family: var(--mono); font-size: 15px; color: var(--soft); white-space: nowrap; }
  .req td.note { white-space: pre-wrap; max-width: 36ch; }
  .req td:last-child { padding-right: 0; text-align: right; }
  .req .del { font: inherit; font-family: var(--mono); font-size: 15px; min-height: 44px; padding: 8px 10px; margin: -8px -10px -8px 0; background: none; border: 0; color: var(--ink); text-decoration: underline; cursor: pointer; }
  .req .del:hover { color: var(--accent); }
  .admin .state { color: var(--soft); font-family: var(--mono); font-size: 15px; min-height: 1.5em; margin: 16px 0 0; }
  @media (max-width: 720px) {
    .req thead { display: none; }
    .req, .req tbody, .req tr, .req td { display: block; width: 100%; }
    .req tr { border-bottom: 1px solid var(--rule); padding: 12px 0; }
    .req td { border: 0; padding: 2px 0; white-space: normal; }
    .req td.when, .req td.page { white-space: normal; }
    .req td:last-child { text-align: left; padding-top: 6px; }
    .req .del { margin: 0; padding: 10px 0; }
    .req td.note { max-width: none; }
  }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="top">
  <div class="wrap bar">
    <a class="brand" href="/"><svg class="mark-anim" viewBox="0 0 64 64" width="28" height="28" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M14 12.5c-.6 12.5-.4 25.6.8 39" stroke-width="5"/><path d="M13.6 13.4c7.4-1.2 13.6-.9 19.6-.4" stroke-width="4"/><path d="M14.4 30c4.6-.7 9-.6 13.4-.2" stroke-width="3.4"/><path d="M33.6 14.2c2.6 11.4 6.2 23.2 10.4 36.4" stroke-width="4.6"/><path d="M44.4 50.2c2.2-12.8 4.8-24.6 8.8-37" stroke-width="3.4"/></g></svg><span>Fenwick and Vale</span></a>
    <nav class="nav" aria-label="Main"><a href="/websites">Websites</a><a href="/google">Google</a><a href="/guides">Guides</a><a href="/about">About</a><a href="/agencies">For agencies</a></nav>
    <p class="stamp"><time id="clock">Cocoa Beach, FL</time></p>
  </div>
</header>

<main id="main" class="wrap admin">
  <h1>Requests</h1>
  <p class="meta">Private. What people typed into the form, newest first. Not indexed, not linked.</p>

  <form id="gate" class="ask" novalidate>
    <div class="field"><label for="token">Admin token</label><input id="token" name="token" type="password" autocomplete="off" required></div>
    <button class="btn" type="submit">Open</button>
    <p class="ask-status mono" role="status" aria-live="polite" id="gate-status"></p>
  </form>

  <div id="list" hidden>
    <div class="tools">
      <button class="btn quiet" type="button" id="copy">Copy as text</button>
      <button class="btn quiet" type="button" id="reload">Reload</button>
      <button class="btn quiet" type="button" id="forget">Forget token</button>
      <span class="count" id="count"></span>
    </div>
    <table class="req" id="table">
      <thead><tr><th scope="col">When</th><th scope="col">Name</th><th scope="col">Contact</th><th scope="col">Business</th><th scope="col">Note</th><th scope="col">Page</th><th scope="col"><span class="vh">Remove</span></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <p class="state" id="state" role="status" aria-live="polite"></p>
  </div>
</main>

<footer class="foot">
  <div class="wrap">
    <p class="mono">Fenwick and Vale · <a href="/">Back to the site</a></p>
  </div>
</footer>

<script>
(function () {
  var KEY = 'fv-admin-token';
  var gate = document.getElementById('gate');
  var gateStatus = document.getElementById('gate-status');
  var list = document.getElementById('list');
  var rowsEl = document.getElementById('rows');
  var state = document.getElementById('state');
  var count = document.getElementById('count');
  var rows = [];

  function getToken() { try { return sessionStorage.getItem(KEY) || ''; } catch (e) { return ''; } }
  function setToken(v) { try { if (v) sessionStorage.setItem(KEY, v); else sessionStorage.removeItem(KEY); } catch (e) {} }

  function when(ts) {
    var d = new Date(ts * 1000);
    return d.toLocaleString('en-US', { timeZone: 'America/New_York', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  }
  function contactLink(c) {
    var a = document.createElement('a');
    var digits = c.replace(/[^0-9+]/g, '');
    if (c.indexOf('@') > -1) a.href = 'mailto:' + c;
    else if (digits.length >= 7) a.href = 'tel:' + digits;
    else a.removeAttribute('href');
    a.textContent = c;
    return a;
  }
  function cell(cls, text) { var td = document.createElement('td'); if (cls) td.className = cls; td.textContent = text; return td; }

  function render() {
    rowsEl.textContent = '';
    count.textContent = rows.length + (rows.length === 1 ? ' request' : ' requests');
    if (!rows.length) { state.textContent = 'Nothing yet.'; return; }
    state.textContent = '';
    rows.forEach(function (r) {
      var tr = document.createElement('tr');
      tr.appendChild(cell('when', when(r.ts)));
      tr.appendChild(cell('', r.name || ''));
      var tdc = document.createElement('td'); tdc.appendChild(contactLink(r.contact || '')); tr.appendChild(tdc);
      tr.appendChild(cell('', r.business || ''));
      tr.appendChild(cell('note', r.note || ''));
      tr.appendChild(cell('page', r.page || ''));
      var tdd = document.createElement('td');
      var del = document.createElement('button'); del.type = 'button'; del.className = 'del'; del.textContent = 'Delete';
      del.setAttribute('aria-label', 'Delete the request from ' + (r.name || 'unknown'));
      del.addEventListener('click', function () { remove(r, tr); });
      tdd.appendChild(del); tr.appendChild(tdd);
      rowsEl.appendChild(tr);
    });
  }

  function asText() {
    return rows.map(function (r) {
      var parts = [when(r.ts), r.name, r.contact];
      if (r.business) parts.push(r.business);
      if (r.page) parts.push('from ' + r.page);
      var line = parts.join(' · ');
      return r.note ? line + '\n  ' + r.note.replace(/\n/g, '\n  ') : line;
    }).join('\n');
  }

  function api(method, path) {
    return fetch(path, { method: method, credentials: 'same-origin', headers: { 'Authorization': 'Bearer ' + getToken() } });
  }

  function load() {
    state.textContent = 'Loading…';
    api('GET', '/api/requests').then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (data) {
        if (r.status === 401) { setToken(''); list.hidden = true; gate.hidden = false; gateStatus.textContent = 'Wrong token.'; return; }
        if (r.status === 503) { state.textContent = 'Storage or ADMIN_TOKEN is not set up yet. See the README.'; list.hidden = false; gate.hidden = true; return; }
        if (!r.ok || !data.ok) { state.textContent = data.error || 'Could not load.'; list.hidden = false; gate.hidden = true; return; }
        rows = data.rows || [];
        gate.hidden = true; list.hidden = false;
        render();
      });
    }).catch(function () { state.textContent = 'Network error.'; list.hidden = false; gate.hidden = true; });
  }

  function remove(r, tr) {
    if (!window.confirm('Delete the request from ' + (r.name || 'this person') + '? This cannot be undone.')) return;
    api('DELETE', '/api/requests?id=' + encodeURIComponent(r.id)).then(function (res) {
      if (!res.ok) { state.textContent = 'Delete failed (' + res.status + ').'; return; }
      rows = rows.filter(function (x) { return x.id !== r.id; });
      tr.remove();
      count.textContent = rows.length + (rows.length === 1 ? ' request' : ' requests');
      state.textContent = 'Deleted.';
    }).catch(function () { state.textContent = 'Network error.'; });
  }

  gate.addEventListener('submit', function (e) {
    e.preventDefault();
    var v = gate.elements.token.value.trim();
    if (!v) { gateStatus.textContent = 'Paste the token.'; return; }
    setToken(v); gateStatus.textContent = '';
    load();
  });
  document.getElementById('reload').addEventListener('click', load);
  document.getElementById('forget').addEventListener('click', function () { setToken(''); rows = []; list.hidden = true; gate.hidden = false; gate.elements.token.value = ''; gate.elements.token.focus(); });
  document.getElementById('copy').addEventListener('click', function () {
    var text = asText();
    var ok = function () { state.textContent = 'Copied ' + rows.length + ' to the clipboard.'; };
    var fail = function () {
      var ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.left = '-9999px';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); ok(); } catch (e) { state.textContent = 'Copy failed. Select the table and copy by hand.'; }
      document.body.removeChild(ta);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fail); else fail();
  });

  if (getToken()) load(); else gate.elements.token.focus();
})();
</script>
</body>
</html>
